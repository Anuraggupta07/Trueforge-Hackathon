[project]
name = "warden"
version = "0.1.0"
description = "Warden: approval-gated, reversible cloud cost cleanup agent built on TrueForge"
authors = [
    { name = "Anurag Gupta", email = "86231425+Anuraggupta07@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.103",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
warden = "warden:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
